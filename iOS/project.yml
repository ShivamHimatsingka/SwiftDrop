name: SwiftDrop
options:
  bundleIdPrefix: com.swiftdrop
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SwiftDrop:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - path: ../Core/Swift
        group: Core
    resources: [Resources/Assets.xcassets]
    info:
      path: Resources/App-Info.plist
      properties:
        CFBundleDisplayName: SwiftDrop
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSLocalNetworkUsageDescription: SwiftDrop finds nearby phones and computers on your Wi‑Fi to share files.
        NSBonjourServices: [_swiftdrop._tcp]
        NSBluetoothAlwaysUsageDescription: SwiftDrop uses Bluetooth to find nearby devices, even when you're not on the same Wi‑Fi.
        NSPhotoLibraryAddUsageDescription: SwiftDrop saves photos and videos you receive to your library.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true, NSAllowsArbitraryLoads: true }
        CFBundleURLTypes: [{ CFBundleURLName: com.swiftdrop.ios, CFBundleURLSchemes: [swiftdrop] }]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        "UISupportedInterfaceOrientations~ipad": [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationPortraitUpsideDown]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftdrop.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: SwiftDropShare
  SwiftDropShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/Share
      - path: ../Core/Swift
        group: Core
    info:
      path: Resources/Share-Info.plist
      properties:
        CFBundleDisplayName: SwiftDrop
        NSLocalNetworkUsageDescription: SwiftDrop finds nearby phones and computers on your Wi‑Fi to share files.
        NSBonjourServices: [_swiftdrop._tcp]
        NSBluetoothAlwaysUsageDescription: SwiftDrop uses Bluetooth to find nearby devices, even when you're not on the same Wi‑Fi.
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true, NSAllowsArbitraryLoads: true }
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY (extensionItems, $extensionItem, SUBQUERY ($extensionItem.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.item" OR ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.content").@count >= 1).@count >= 1'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftdrop.ios.share
        TARGETED_DEVICE_FAMILY: "1,2"
